name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build
        run: dotnet build ./src/ShiBox/ShiBox.csproj -c Release
      - name: Check isolated storage
        shell: pwsh
        run: |
          $scratchPath = Join-Path $env:RUNNER_TEMP 'shibox-check'
          New-Item -ItemType Directory -Force $scratchPath | Out-Null
          dotnet ./src/ShiBox/bin/Release/net9.0-windows/ShiBox.dll --storage-check $scratchPath
          if ($LASTEXITCODE -ne 0) { throw 'Storage check failed' }
          $result = Get-Content (Join-Path $scratchPath 'result.json') -Raw | ConvertFrom-Json
          if (-not $result.passed) { throw 'Storage check did not pass' }
      - name: Check restart recovery
        shell: pwsh
        run: |
          $scratchPath = Join-Path $env:RUNNER_TEMP 'shibox-restart-check'
          New-Item -ItemType Directory -Force $scratchPath | Out-Null
          dotnet ./src/ShiBox/bin/Release/net9.0-windows/ShiBox.dll --restart-check $scratchPath
          if ($LASTEXITCODE -ne 0) { throw 'Restart recovery check failed' }
          $result = Get-Content (Join-Path $scratchPath 'restart-result.json') -Raw | ConvertFrom-Json
          if (-not $result.passed) { throw 'Restart recovery check did not pass' }
      - name: Publish framework-dependent Windows x64 build
        run: dotnet publish ./src/ShiBox/ShiBox.csproj -c Release -r win-x64 --self-contained false -o ./artifacts/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: ShiBox-win-x64-requires-dotnet9
          path: artifacts/win-x64/
